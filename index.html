<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Guntas 🎂</title>
<style>
:root{--bg:#f3e6d3;--ink:#3b1a14;--pill:#c1342a;--pillink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a0d0b;--ink:#ffe9c9}}
:root[data-theme="dark"]{--bg:#2a0d0b;--ink:#ffe9c9}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;-webkit-tap-highlight-color:transparent}
.card{position:relative;width:min(94vw,calc((100dvh - 120px) * .7092));aspect-ratio:1240/1748;overflow:hidden;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.35);background:#fff}
.track{display:flex;height:100%;transition:transform .7s cubic-bezier(.7,0,.2,1)}
.page{flex:0 0 100%;position:relative;height:100%}
.page>img.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.pill{position:absolute;left:50%;transform:translateX(-50%);border:0;border-radius:99px;background:var(--pill);color:var(--pillink);font:700 clamp(14px,4vw,20px) inherit;padding:.7em 1.4em;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3);white-space:nowrap}
.pill:active{transform:translateX(-50%) scale(.96)}
.pulse{animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(255,255,255,.25)}}
.letter{position:absolute;inset:0;width:100%;height:100%;transform:translateY(75%) scale(.8) rotate(-3deg);opacity:0;transition:all .9s cubic-bezier(.2,.8,.2,1);pointer-events:none;box-shadow:0 0 30px rgba(0,0,0,.3)}
.open .letter{transform:none;opacity:1}
.open .pill{opacity:0;pointer-events:none}
.flame{position:absolute;transform-origin:50% 100%;transition:opacity .35s,transform .35s;cursor:pointer;animation:flick .5s infinite alternate ease-in-out}
@keyframes flick{from{rotate:-3deg;scale:1}to{rotate:3deg;scale:1.06 .96}}
.flame.out{opacity:0;transform:scale(.3) translateY(-20px);animation:none;pointer-events:none}
.smoke{position:absolute;width:5%;aspect-ratio:1;border-radius:50%;background:radial-gradient(#fffc,#fff0 70%);opacity:0;pointer-events:none;filter:blur(2px)}
.smoke.go{animation:smoke 1.8s ease-out forwards}
@keyframes smoke{0%{opacity:.8;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(10px,-120px) scale(2.5)}}
.hint{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);text-align:center;color:#fff;background:#0007;border-radius:14px;padding:.5em 1em;font-size:clamp(12px,3.4vw,16px);width:max-content;max-width:86%}
.meter{height:6px;background:#fff4;border-radius:9px;margin-top:6px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:#ffd84d}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.win{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;background:#000a;color:#ffe27a;font:900 clamp(26px,9vw,52px)/1.1 "Arial Black",system-ui,sans-serif;padding:20px}
.win.show{display:flex}.win .pill{position:static;transform:none;font-size:16px}
nav{display:flex;align-items:center;gap:14px;height:44px}
nav button{width:40px;height:40px;border-radius:50%;border:0;background:var(--pill);color:#fff;font-size:20px;cursor:pointer}
nav button:disabled{opacity:.3}
.dots{display:flex;gap:8px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--ink);opacity:.3}.dots i.on{opacity:1}
</style></head><body>

<script>
const $=id=>document.getElementById(id);
let idx=0,letterOpen=false;
function go(i){idx=Math.max(0,Math.min(2,i));$('track').style.transform=`translateX(${-idx*100}%)`;
 document.querySelectorAll('.dots i').forEach((d,k)=>d.classList.toggle('on',k==idx));
 $('prev').disabled=idx==0;$('next').disabled=idx==2;}
$('prev').onclick=()=>go(idx-1);$('next').onclick=()=>go(idx+1);go(0);
$('openL').onclick=()=>{$('p2').classList.add('open');letterOpen=true};

const flames=[...document.querySelectorAll('.flame')],smokes=[...document.querySelectorAll('.smoke')];
let stream,ctx,an,buf,raf,base=0,t0=0,acc=0,last=0,done=false;
function snuff(i){const f=flames[i];if(f.classList.contains('out'))return;f.classList.add('out');
 const s=smokes[i];s.classList.remove('go');void s.offsetWidth;s.classList.add('go');
 if(flames.every(x=>x.classList.contains('out')))win();}
flames.forEach((f,i)=>f.onclick=()=>snuff(i));
function lit(){return flames.map((f,i)=>i).filter(i=>!flames[i].classList.contains('out'))}
function stopMic(){cancelAnimationFrame(raf);stream&&stream.getTracks().forEach(t=>t.stop());stream=null;$('lvl').style.width=0}
async function startMic(){
 try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});}
 catch(e){$('hintT').textContent="Mic not available — tap the flames to blow them out 👆";$('mic').style.display='none';return}
 ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();
 an=ctx.createAnalyser();an.fftSize=1024;ctx.createMediaStreamSource(stream).connect(an);buf=new Float32Array(an.fftSize);
 $('mic').style.display='none';$('hintT').textContent="Listening… take a deep breath and blow! 🌬️";
 t0=performance.now();last=t0;base=0;let n=0;
 const loop=now=>{an.getFloatTimeDomainData(buf);let s=0;for(const v of buf)s+=v*v;const rms=Math.sqrt(s/buf.length);
  const dt=(now-last)/1000;last=now;
  if(now-t0<700){base+=rms;n++;if(now-t0>=690)base/=n}
  else{const thr=Math.max(.12,base*3.5);
   $('lvl').style.width=Math.min(100,rms/(thr*1.6)*100)+'%';
   const sway=Math.min(1,rms/thr);flames.forEach(f=>{if(!f.classList.contains('out'))f.style.transform=`rotate(${sway*14}deg) scaleY(${1-sway*.25})`});
   if(rms>thr){acc+=dt;if(acc>.22){acc=0;const l=lit();if(l.length)snuff(l[Math.floor(Math.random()*l.length)])}}
   else{acc=Math.max(0,acc-dt*.5)}}
  raf=requestAnimationFrame(loop)};
 raf=requestAnimationFrame(loop);
}
$('mic').onclick=startMic;

const cv=$('fx'),c2=cv.getContext('2d');let parts=[],anim;
function win(){stopMic();$('hint').style.display='none';
 const r=cv.getBoundingClientRect();cv.width=r.width;cv.height=r.height;
 const cols=['#ffd84d','#ff6f91','#6fd3c4','#8fa8ff','#fff'];
 parts=Array.from({length:160},()=>({x:r.width/2,y:r.height*.55,vx:(Math.random()-.5)*14,vy:-Math.random()*16-4,s:4+Math.random()*7,c:cols[Math.random()*5|0],a:Math.random()*6}));
 setTimeout(()=>$('win').classList.add('show'),500);
 const step=()=>{c2.clearRect(0,0,cv.width,cv.height);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.a+=.2;c2.save();c2.translate(p.x,p.y);c2.rotate(p.a);c2.fillStyle=p.c;c2.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);c2.restore()});
  parts=parts.filter(p=>p.y<cv.height+20);if(parts.length)anim=requestAnimationFrame(step)};step();}
$('again').onclick=()=>{$('win').classList.remove('show');flames.forEach(f=>{f.classList.remove('out');f.style.transform=''});
 $('hint').style.display='';$('hintT').textContent="Make a wish, then…";$('mic').style.display='';c2.clearRect(0,0,cv.width,cv.height)};
</script></body></html>
